name: Test Artifact with QEMU and noVNC

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 'Artifact URL (e.g., https://github.com/owner/repo/actions/runs/123/artifacts/456)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-system-x86 ovmf novnc websockify curl wget unzip jq

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Download artifact via API
        run: |
          mkdir -p ./artifact
          cd ./artifact
          
          ARTIFACT_URL="${{ github.event.inputs.artifact_url }}"
          ARTIFACT_ID=$(echo "$ARTIFACT_URL" | grep -oE '[0-9]+$')
          
          echo "Artifact ID: $ARTIFACT_ID"
          
          API_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID")
          
          DOWNLOAD_URL=$(echo "$API_RESPONSE" | jq -r '.archive_download_url')
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Cannot get download URL"
            echo "API Response: $API_RESPONSE"
            exit 1
          fi
          
          echo "Download URL: $DOWNLOAD_URL"
          
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o artifact.zip "$DOWNLOAD_URL"
          
          unzip artifact.zip

      - name: Extract image
        run: |
          cd ./artifact
          if ls *.xz 1> /dev/null 2>&1; then
            xz -d *.xz
          fi
          IMG_FILE=$(ls *.img 2>/dev/null | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            mv "$IMG_FILE" disk.img
          else
            echo "No .img file found!"
            exit 1
          fi

      - name: Start QEMU with VNC (UEFI & Legacy compatible)
        run: |
          cd ./artifact
          # Tìm OVMF cho UEFI boot
          OVMF_PATH=$(find /usr/share -name "OVMF_CODE.fd" 2>/dev/null | head -n1)
          if [ -n "$OVMF_PATH" ] && [ -f "$OVMF_PATH" ]; then
            BIOS_OPT="-bios $OVMF_PATH"
            echo "✅ Using UEFI (OVMF): $OVMF_PATH"
          else
            # Fallback: Legacy BIOS
            BIOS_OPT=""
            echo "⚠️ OVMF not found, using Legacy BIOS (SeaBIOS)"
          fi
          
          # Không dùng KVM vì runner không hỗ trợ, dùng TCG với CPU qemu64
          qemu-system-x86_64 \
            -drive file=disk.img,format=raw \
            -m 2048 \
            $BIOS_OPT \
            -vnc :1 \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -cpu qemu64 \
            -machine accel=tcg \
            -serial file:qemu.log &
          
          # Đợi QEMU khởi động
          sleep 15

      - name: Start noVNC
        run: |
          websockify --web /usr/share/novnc 6080 localhost:5901 &
          sleep 5

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 &
          sleep 10
          curl -s http://localhost:4040/api/tunnels | jq -r '.result[0].url' > tunnel_url.txt || echo "http://localhost:6080" > tunnel_url.txt

      - name: Show public URL
        run: |
          echo "=========================================="
          echo "  🖥️  VNC Server is running!"
          echo "  📡 Public URL: $(cat tunnel_url.txt)/vnc.html"
          echo "  ⏱️  This URL will be active for ~15 minutes."
          echo "=========================================="
          echo ""
          echo "====== QEMU Serial Log (first 50 lines) ======"
          cat ./artifact/qemu.log 2>/dev/null | head -50 || echo "No log yet"

      - name: Keep alive for testing
        run: sleep 900
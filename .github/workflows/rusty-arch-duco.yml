name: Build Arch Linux with DuinoCoin Miner (with GUI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y wget curl git dosfstools e2fsprogs parted xz-utils

      - name: Create image file and partitions
        run: |
          dd if=/dev/zero of=arch-duco.img bs=1M count=8192
          parted arch-duco.img mklabel gpt
          parted arch-duco.img mkpart primary fat32 1MiB 513MiB
          parted arch-duco.img set 1 esp on
          parted arch-duco.img mkpart primary ext4 513MiB 100%
          sudo losetup -P /dev/loop0 arch-duco.img
          sudo mkfs.fat -F32 /dev/loop0p1
          sudo mkfs.ext4 -F /dev/loop0p2

      - name: Mount and bootstrap using Arch Docker
        run: |
          sudo mkdir -p /mnt/arch
          sudo mount /dev/loop0p2 /mnt/arch
          sudo mkdir -p /mnt/arch/boot/efi
          sudo mount /dev/loop0p1 /mnt/arch/boot/efi

          docker run --rm -v /mnt/arch:/mnt/arch --privileged archlinux:latest /bin/bash -c "
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm
            pacman -S --noconfirm arch-install-scripts
            pacstrap /mnt/arch base base-devel linux linux-firmware tmux git openssh networkmanager sudo vim rust cargo curl wget \
              xorg xorg-server xfce4 xfce4-goodies lightdm lightdm-gtk-greeter \
              firefox ttf-freefont ttf-dejavu ttf-ubuntu-font-family
            genfstab -U /mnt/arch >> /mnt/arch/etc/fstab
          "

      - name: Copy miner source into image
        run: |
          sudo mkdir -p /mnt/arch/root/rust-miner
          sudo cp -r miner/* /mnt/arch/root/rust-miner/

      - name: Configure system in chroot
        run: |
          cat > /tmp/chroot-script.sh << 'SCRIPT'
            # Cấu hình cơ bản
            ln -sf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
            hwclock --systohc
            echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
            locale-gen
            echo 'LANG=en_US.UTF-8' > /etc/locale.conf
            echo 'KEYMAP=us' > /etc/vconsole.conf
            echo 'arch-duco' > /etc/hostname
            
            # Enable services
            systemctl enable NetworkManager
            systemctl enable lightdm
            
            # Tạo users
            echo 'root:duco' | chpasswd
            useradd -m -G wheel -s /bin/bash miner
            echo 'miner:miner' | chpasswd
            echo '%wheel ALL=(ALL) ALL' >> /etc/sudoers
            
            # Build miner
            cd /root/rust-miner
            cargo build --release
            
            # Tạo script để chạy miner
            cat > /usr/local/bin/start-miner << 'EOFMINER'
            #!/bin/bash
            cd /root/rust-miner
            ./target/release/duco_rust_miner
            EOFMINER
            chmod +x /usr/local/bin/start-miner
            
            # Tạo desktop shortcut
            mkdir -p /home/miner/Desktop
            cat > /home/miner/Desktop/duco-miner.desktop << 'EOFDESKTOP'
            [Desktop Entry]
            Version=1.0
            Type=Application
            Name=DuinoCoin Miner
            Comment=Start DuinoCoin Miner
            Exec=xfce4-terminal --title=Duino-Miner --hold -e start-miner
            Icon=utilities-terminal
            Terminal=false
            Categories=Utility;
            EOFDESKTOP
            chmod +x /home/miner/Desktop/duco-miner.desktop
            chown -R miner:miner /home/miner/Desktop
            
            # Copy to applications menu
            mkdir -p /home/miner/.local/share/applications
            cp /home/miner/Desktop/duco-miner.desktop /home/miner/.local/share/applications/
            chown -R miner:miner /home/miner/.local
            
            # Cấu hình lightdm
            cat > /etc/lightdm/lightdm.conf << 'EOFLIGHTDM'
            [Seat:*]
            greeter-session=lightdm-gtk-greeter
            user-session=xfce
            EOFLIGHTDM
            
            # Message khi đăng nhập
            cat > /etc/motd << 'EOFMOTD'
            ===========================================
              Arch Linux with DuinoCoin Miner
            ===========================================
              
              Users:
                root : duco
                miner: miner
              
              To start miner:
                - Desktop icon: DuinoCoin Miner
                - Command: start-miner
              
              GUI: Xfce4
            ===========================================
            EOFMOTD
            
            # Cấu hình GRUB
            pacman -S --noconfirm grub efibootmgr
            grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=GRUB
            grub-mkconfig -o /boot/grub/grub.cfg
            
            # Dọn dẹp
            pacman -Scc --noconfirm
            rm -rf /var/cache/pacman/pkg/*
            rm -rf /root/.cargo/registry
            rm -rf /root/.cargo/git
SCRIPT

          docker run --rm -v /mnt/arch:/mnt/arch --privileged archlinux:latest /bin/bash -c "
            pacman -Syu --noconfirm
            pacman -S --noconfirm arch-install-scripts
            cp /tmp/chroot-script.sh /mnt/arch/tmp/
            /usr/bin/arch-chroot /mnt/arch /bin/bash /tmp/chroot-script.sh
            rm -f /mnt/arch/tmp/chroot-script.sh
          "

      - name: Cleanup and compress image
        run: |
          sudo umount /mnt/arch/boot/efi
          sudo umount /mnt/arch
          sudo losetup -d /dev/loop0
          xz -z -9 -c arch-duco.img > arch-duco.img.xz
          sha256sum arch-duco.img.xz > arch-duco.img.xz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-duco-image-gui
          path: |
            arch-duco.img.xz
            arch-duco.img.xz.sha256
